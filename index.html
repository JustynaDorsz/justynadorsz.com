<title>Justyna Dorsz</title>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 300; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 24px 20px; }
  header h1 { margin: 0; font-size: 15px; font-weight: 400; letter-spacing: 0.04em; color: #ddd; }
  nav { font-size: 13px; letter-spacing: 0.04em; }
  nav a { color: #888; text-decoration: none; margin-left: 20px; }
  nav a:hover { color: #fff; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; padding: 0 6px; }
  main a { display: block; background: #111; overflow: hidden; }
  main img { display: block; width: 100%; height: auto; aspect-ratio: 1; transition: opacity .2s; }
  main a:hover img { opacity: .75; }
  footer { text-align: center; color: #555; font-size: 12px; padding: 48px 16px; letter-spacing: 0.1em; }
  @media (max-width: 480px) { main { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
